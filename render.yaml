services:
  - type: web
    name: echogpt-backend
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PROVIDER_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM_NAME
        value: EchoGPT
      - key: OTP_SECRET
        generateValue: true
      - key: OTP_EXPIRES_MINUTES
        value: 5
      - key: OTP_RESEND_SECONDS
        value: 60
      - key: OTP_MAX_ATTEMPTS
        value: 5
